name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NOBOOK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret NOBOOK_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOBOOK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nobook.jks"

      - name: Build signed release APK
        env:
          NOBOOK_KEYSTORE_FILE: ${{ runner.temp }}/nobook.jks
          NOBOOK_KEYSTORE_PASSWORD: ${{ secrets.NOBOOK_KEYSTORE_PASSWORD }}
          NOBOOK_KEY_ALIAS: ${{ secrets.NOBOOK_KEY_ALIAS }}
          NOBOOK_KEY_PASSWORD: ${{ secrets.NOBOOK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "nobook-${VERSION}.apk"
          gh release create "$GITHUB_REF_NAME" "nobook-${VERSION}.apk" \
            --title "Release ${VERSION}" --generate-notes
